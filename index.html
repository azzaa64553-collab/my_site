<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA3 Cyber Security</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="bg"></div>

<div class="login-box">

    <img src="assets/logo.png" class="logo" alt="LA3">

    <h1>LA3 Cyber Security</h1>

    <p class="subtitle">
        ورود به چت گروهی
    </p>

    <div class="input-group">

        <label>کد کاربری</label>

        <input
            type="text"
            id="userCode"
            placeholder="مثال : LA301"
            autocomplete="off">

    </div>

    <div class="input-group">

        <label>PIN</label>

        <input
            type="password"
            id="pin"
            maxlength="6"
            placeholder="******">

    </div>

    <button id="loginBtn">
        ورود
    </button>

    <p id="loginStatus"></p>

</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>

</body>
          </html>
