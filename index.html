<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LA3 Cyber Security</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- صفحه ورود اصلی -->

<div id="login-screen">

<div class="login-box">

<h2>ورود به سیستم</h2>


<input
type="password"
id="password"
placeholder="رمز عبور">


<button id="toggle">
نمایش / مخفی
</button>


<button id="loginBtn">
ورود
</button>


<p id="message"></p>

<p id="countdown"></p>


</div>

</div>





<!-- سایت -->

<div id="site">


<header>

<h1>
LA3 Cyber Security
</h1>

</header>



<main>


<h2>
خوش آمدید
</h2>


<button id="membersBtn">
اعضا تیم
</button>


<button id="chatBtn">
💬 چتروم
</button>



</main>


</div>







<!-- صفحه اعضای تیم -->


<div id="membersPage">


<h2>
اعضا تیم
</h2>



<table>


<tr>
<th>
نام اعضا
</th>
</tr>



<tr>
<td>
سید علی اصغر
</td>
</tr>


<tr>
<td>
سید علی موسوی
</td>
</tr>


<tr>
<td>
محمد
</td>
</tr>


<tr>
<td>
طاها زالی
</td>
</tr>


<tr>
<td>
سعدی
</td>
</tr>



</table>



<button id="backBtn">
بازگشت
</button>



</div>









<!-- ورود چتروم -->


<div id="chatLogin">


<div class="login-box">


<h2>
ورود به چتروم
</h2>



<input
type="password"
id="chatCode"
placeholder="کد کاربری">



<button id="chatEnter">
ورود
</button>



<p id="chatMessage"></p>


</div>


</div>









<!-- صفحه چتروم -->


<div id="chatRoom">


<h2>
💬 چتروم LA3
</h2>
<div id="membersList">

  </div>


<div id="messages">

</div>




<input
id="chatText"
placeholder="پیام خود را بنویسید">



<button id="sendBtn">
ارسال
</button>




<button id="clearChat">
پاک کردن تاریخچه
</button>



<button id="exitChat">
خروج
</button>



</div>







<!-- Firebase -->







<script type="module" src="script.js"></script>



</body>

</html>
