<!DOCTYPE html>

<body>

        <p id="message"></p>
        <p id="countdown"></p>
    </div>
</div>

<!-- سایت -->
<div id="site">

<header>
    <h1>LA3 Cyber Security</h1>
</header>

<main>

<h2>خوش آمدید</h2>

<p>
این صفحه بعد از وارد کردن رمز عبور نمایش داده می‌شود.
</p>

</main>

</div>

<script src="script.js"></script>
