<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA3 Cyber</title><style>
body{margin:0;background:#000;color:#0f0;font-family:Arial;text-align:center}
canvas{position:fixed;inset:0;z-index:-1}h1{margin-top:20vh;font-size:3em}button{padding:12px 24px;background:#0f0;border:0;border-radius:8px}
</style></head><body><canvas id=c></canvas><h1>LA3 CYBER</h1><p>Single-file HTML demo</p><button onclick="alert('سلام!')">شروع</button><script>
let x=c.getContext('2d');function r(){c.width=innerWidth;c.height=innerHeight}onresize=r;r();
let y=[];for(let i=0;i<200;i++)y[i]=Math.random()*c.height;
(function a(){x.fillStyle='rgba(0,0,0,.08)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#0f0';x.font='16px monospace';
for(let i=0;i<y.length;i++){let xx=i*10;x.fillText(String.fromCharCode(0x30A0+Math.random()*96),xx,y[i]);y[i]+=16;if(y[i]>c.height)y[i]=0;}requestAnimationFrame(a)})();
</script></body></html>
